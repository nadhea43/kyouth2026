<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ChatBot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .chat-wrapper { max-width: 800px; margin: 0 auto; }
        #chat-history {
            height: 65vh;
            overflow-y: auto;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #dee2e6;
        }
        .bubble-user {
            background: #0d6efd;
            color: white;
            padding: 10px 15px;
            border-radius: 18px 18px 4px 18px;
            max-width: 75%;
            margin-bottom: 10px;
            margin-left: auto;
            width: fit-content;
            word-wrap: break-word;
        }
        .bubble-bot {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 18px 18px 18px 4px;
            padding: 10px 15px;
            max-width: 75%;
            margin-bottom: 10px;
            width: fit-content;
            word-wrap: break-word;
        }
        .bubble-thinking {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 18px 18px 18px 4px;
            padding: 10px 15px;
            max-width: 75%;
            margin-bottom: 10px;
            width: fit-content;
            color: #6c757d;
            font-style: italic;
        }
        /* PDF attachment bubble — shown in chat when file is sent */
        .bubble-pdf {
            background: #e7f1ff;
            border: 1px solid #b6d4fe;
            border-radius: 18px 18px 4px 18px;
            padding: 8px 14px;
            max-width: 75%;
            margin-bottom: 4px;
            margin-left: auto;
            width: fit-content;
            font-size: 13px;
            color: #0d6efd;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #pdf-input { display: none; }
        #attach-btn {
            border: 1px solid #dee2e6;
            background: white;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: #6c757d;
            transition: all 0.2s;
        }
        #attach-btn:hover { background: #e9ecef; color: #0d6efd; }
        #attach-btn.has-file {
            background: #e7f1ff;
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .input-area {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 24px;
            padding: 6px 6px 6px 16px;
        }
        .input-area input[type="text"] {
            border: none;
            outline: none;
            flex: 1;
            font-size: 15px;
            background: transparent;
        }
        .input-area input[type="text"]:focus { box-shadow: none; }
        #send-btn { border-radius: 20px; padding: 8px 20px; flex-shrink: 0; }
        #pdf-status {
            font-size: 12px;
            color: #0d6efd;
            margin-top: 6px;
            margin-left: 8px;
            min-height: 18px;
        }
    </style>
</head>
<body>
<div class="container py-4 chat-wrapper">
    <h4 class="mb-4">💬 ChatBot</h4>

    <!-- Chat history -->
    <div id="chat-history" class="mb-3"></div>

    <!-- PDF status (shows filename when attached, clears after send) -->
    <div id="pdf-status"></div>

    <!-- Input area -->
    <div class="input-area mt-2">
        <input type="file" id="pdf-input" accept=".pdf">

        <!-- Paperclip button -->
        <button id="attach-btn" title="Attach PDF" onclick="document.getElementById('pdf-input').click()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z"/>
            </svg>
        </button>

        <input type="text" id="user-input" placeholder="Type your message...">
        <button class="btn btn-primary" id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- pdf.js -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.3.136/build/pdf.min.mjs" type="module"></script>

<script type="module">
    const BACKEND_URL = "{{backend_url}}";

    let extractedPdfText = "";
    let attachedFileName = "";  // track the filename separately

    // ── PDF upload handler ────────────────────────────────────
    document.getElementById("pdf-input").addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById("pdf-status").textContent = "📄 Reading PDF...";

        const { getDocument, GlobalWorkerOptions } = await import(
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.3.136/build/pdf.min.mjs"
        );
        GlobalWorkerOptions.workerSrc =
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.3.136/build/pdf.worker.min.mjs";

        const arrayBuffer = await file.arrayBuffer();
        const pdf = await getDocument({ data: arrayBuffer }).promise;

        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(item => item.str).join(" ") + "\n";
        }

        extractedPdfText = text;
        attachedFileName = file.name;

        document.getElementById("pdf-status").textContent =
            `📎 ${file.name} (${pdf.numPages} page(s)) — ready to send`;
        document.getElementById("attach-btn").classList.add("has-file");
    });

    // ── Add regular chat bubble ───────────────────────────────
    function addBubble(text, role) {
        const div = document.createElement("div");
        div.className = role === "user" ? "bubble-user" : "bubble-bot";
        div.textContent = text;
        const history = document.getElementById("chat-history");
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }

    // ── Add PDF attachment bubble in chat ─────────────────────
    function addPdfBubble(filename) {
        const div = document.createElement("div");
        div.className = "bubble-pdf";
        div.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                <path d="M4.5 3a2.5 2.5 0 0 1 5 0v9a1.5 1.5 0 0 1-3 0V5a.5.5 0 0 1 1 0v7a.5.5 0 0 0 1 0V3a1.5 1.5 0 1 0-3 0v9a2.5 2.5 0 0 0 5 0V5a.5.5 0 0 1 1 0v7a3.5 3.5 0 1 1-7 0z"/>
            </svg>
            ${filename}
        `;
        const history = document.getElementById("chat-history");
        history.appendChild(div);
        history.scrollTop = history.scrollHeight;
    }

    // ── Add thinking bubble ───────────────────────────────────
    function addThinking() {
        const div = document.createElement("div");
        div.className = "bubble-thinking";
        div.id = "thinking-bubble";
        div.textContent = "Thinking...";
        document.getElementById("chat-history").appendChild(div);
        document.getElementById("chat-history").scrollTop =
            document.getElementById("chat-history").scrollHeight;
    }

    function removeThinking() {
        const t = document.getElementById("thinking-bubble");
        if (t) t.remove();
    }

    // ── Clear attachment after sending ────────────────────────
    function clearAttachment() {
        extractedPdfText = "";
        attachedFileName = "";
        document.getElementById("pdf-input").value = ""; // reset file input
        document.getElementById("pdf-status").textContent = "";
        document.getElementById("attach-btn").classList.remove("has-file");
    }

    // ── Send message ──────────────────────────────────────────
    window.sendMessage = async function () {
        const input = document.getElementById("user-input");
        const message = input.value.trim();
        if (!message) return;

        // If a PDF is attached, show it as a bubble above the message
        if (attachedFileName) {
            addPdfBubble(attachedFileName);
        }

        addBubble(message, "user");
        input.value = "";
        addThinking();

        const payload = {
            message: message,
            pdf_text: extractedPdfText
        };

        // Clear attachment right after sending
        clearAttachment();

        try {
            const response = await fetch(`${BACKEND_URL}/chat`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            removeThinking();
            addBubble(data.reply, "bot");
        } catch (error) {
            console.error("Error:", error);
            removeThinking();
            addBubble("Sorry, something went wrong.", "bot");
        }
    };

    // Press Enter to send
    document.getElementById("user-input").addEventListener("keypress", function (event) {
        if (event.key === "Enter") window.sendMessage();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
